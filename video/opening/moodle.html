<!doctype html>
<!-- Opening (1920x1080, 15.84 s), timed to Bob's intro-v4 voiceover which starts at t=0.
     0-6.4 the real course page scrolls from the case schedule to the Course Journal · 9.9 "What is your definition of leadership?" lifts off
     12.05 "Do you fit your definition of leadership?" lifts, "fit" is highlighted · 13.6 a blank journal page; the answer types itself, easily -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:News;src:url(../fonts/newsreader-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:News;src:url(../fonts/newsreader-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:News;src:url(../fonts/newsreader-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:News;src:url(../fonts/newsreader-latin-400-italic.woff2);font-weight:400;font-style:italic}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0c0c10}
#page{position:absolute;left:0;top:0;width:2479px;height:7016px;transform-origin:0 0;background:#fff url(tall.png) 0 0/2479px 7016px no-repeat}
#dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(12,12,18,.55),rgba(12,12,18,.86));opacity:0}
.strip{position:absolute;left:0;top:0;background:#fff url(tall.png) no-repeat;transform-origin:50% 50%;box-shadow:0 30px 60px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.25);opacity:0}
.hl{position:absolute;top:18%;height:64%;background:rgba(255,214,64,.62);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0);border-radius:6px}
#doc{position:absolute;inset:0;background:#f7f5f0;opacity:0}
#doc .col{position:absolute;left:330px;top:250px;width:1260px}
#doc h1{font:600 46px/1.2 News;color:#1d1d24;letter-spacing:-.005em}
#doc h2{font:500 32px/1.3 News;color:#6b6a72;margin-top:26px}
#doc p{font:400 50px/1.35 News;color:#1d1d24;margin-top:54px;min-height:70px}
#caret{display:inline-block;width:3px;height:52px;background:#1d1d24;vertical-align:-8px;margin-left:3px}
#fade{position:absolute;inset:0;background:#0c0c10}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.35));pointer-events:none}
</style></head><body>
<div id="page"></div>
<div id="dim"></div>
<div class="strip" id="sa"></div>
<div class="strip" id="sb"><div class="hl" id="hl"></div></div>
<div id="doc"><div class="col"><h1>1. Defining Leadership</h1><h2>a) What is your definition of leadership?</h2><p><span id="typed"></span><span id="caret"></span></p></div></div>
<div class="vign"></div>
<div id="fade"></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const io = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const S = 0.86, CX = 1240, P3 = 3508;                       // display scale; page column centre in source px; page 3 offset
const left = 960 - CX * S;
// source y at the top of the screen
const viewY = t => t < 6.4 ? 860 + (P3 - 150 - 860) * io(t / 6.4) : P3 - 150 + 400 * sm((t - 6.4) / 4.5);
const lines = { a: [190, 874, 900, 947], b: [190, 947, 940, 1014] };   // source rects x0,y0,x1,y1 (page 3)
function strip(el, [x0, y0, x1, y1], tLift, tx, ty, rot, t) {
  const w = x1 - x0, h = y1 - y0;
  el.style.width = w * S + 'px'; el.style.height = h * S + 'px';
  el.style.backgroundSize = 2479 * S + 'px ' + 7016 * S + 'px';
  el.style.backgroundPosition = `${-x0 * S}px ${-(P3 + y0) * S}px`;
  const vy = viewY(Math.min(t, tLift));
  const sx = left + x0 * S + w * S / 2, sy = (P3 + y0 - vy) * S + h * S / 2;   // where the line sits on the page
  const p = eo((t - tLift) / 0.75), z = 1 + 1.05 * p;
  const cx = sx + (tx - sx) * p, cy = sy + (ty - sy) * p;
  el.style.opacity = t < tLift ? 0 : 1;
  el.style.transform = `translate(${cx - w * S / 2}px,${cy - h * S / 2}px) scale(${z}) rotate(${rot * p}deg)`;
}
const answer = 'Leadership is helping people get somewhere together.';
window.render = t => {
  const vy = viewY(t);
  $('#page').style.transform = `translate(${left}px,${-vy * S}px) scale(${S})`;
  const d = sm((t - 9.9) / 0.7);
  $('#dim').style.opacity = d; $('#page').style.filter = d ? `blur(${4 * d}px)` : '';
  strip($('#sa'), lines.a, 9.9, 960, 430, -1.2, t);
  strip($('#sb'), lines.b, 12.05, 960, 640, 0.8, t);
  // highlight "fit your definition" (source x 359-654, from the PDF word boxes)
  const hl = $('#hl'); hl.style.left = (359 - 190) * S + 'px'; hl.style.width = (654 - 359) * S + 'px';
  hl.style.transform = `scaleX(${eo((t - 12.75) / 0.45)})`;
  // the blank journal page, and an answer that comes easily
  const o = sm((t - 13.55) / 0.35); $('#doc').style.opacity = o;
  ['#sa', '#sb'].forEach(s => { if (t > 13.55) $(s).style.opacity = 1 - o; });
  const n = Math.round(clamp((t - 13.95) / 1.25) * answer.length); $('#typed').textContent = answer.slice(0, n);
  $('#caret').style.opacity = (n < answer.length || Math.floor(t * 2.2) % 2 === 0) ? 1 : 0;
  $('#fade').style.opacity = 1 - sm(t / 0.6);
};
window.ready = true;
</script></body></html>
